# MiSub INI 模板：良心云 / AshCloud 机场与机场-地区分组
# 适配 AIsouler mihomoConfigLite.yaml + MiSub Clash YAML 基础模板。
# 节点名称必须以来源标签开头，例如：
#   良心云 | 🇯🇵 日本#01
#   AshCloud | 🇭🇰 香港#01
#
# [Proxy Group] 创建机场组及机场-地区组。
# [Proxy Group Append] 只追加成员，不覆盖基础 YAML 原有组的类型、图标、过滤器等属性。
# 当前 AIsouler 模板的台湾组名是“台湾”，不是“台湾省”。

[Proxy Group]
良心云 = select, 良心云-自动选择, 良心云-香港, 良心云-台湾, 良心云-美国, 良心云-新加坡, 良心云-日本, 良心云-英国
AshCloud = select, AshCloud-自动选择, AshCloud-香港, AshCloud-台湾, AshCloud-澳门, AshCloud-美国, AshCloud-新加坡, AshCloud-日本, AshCloud-韩国, AshCloud-德国, AshCloud-印度, AshCloud-立陶宛, AshCloud-荷兰, AshCloud-英国, AshCloud-法国, AshCloud-马来西亚

良心云-自动选择 = url-test, include-all=true, filter=(?i)^良心云\s*\|.*, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
AshCloud-自动选择 = url-test, include-all=true, filter=(?i)^AshCloud\s*\|.*, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50

良心云-香港 = select, 良心云-香港-自动选择
良心云-香港-自动选择 = url-test, include-all=true, filter=(?i)^良心云\s*\|.*(?:🇭🇰|香港|Hong\s*Kong|\bHK\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
良心云-台湾 = select, 良心云-台湾-自动选择
良心云-台湾-自动选择 = url-test, include-all=true, filter=(?i)^良心云\s*\|.*(?:🇹🇼|台湾|台灣|台北|高雄|Taiwan|\bTW\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
良心云-美国 = select, 良心云-美国-自动选择
良心云-美国-自动选择 = url-test, include-all=true, filter=(?i)^良心云\s*\|.*(?:🇺🇸|美国|美國|纽约|洛杉矶|旧金山|西雅图|USA|\bUS\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
良心云-新加坡 = select, 良心云-新加坡-自动选择
良心云-新加坡-自动选择 = url-test, include-all=true, filter=(?i)^良心云\s*\|.*(?:🇸🇬|新加坡|狮城|Singapore|\bSG\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
良心云-日本 = select, 良心云-日本-自动选择
良心云-日本-自动选择 = url-test, include-all=true, filter=(?i)^良心云\s*\|.*(?:🇯🇵|日本|东京|大阪|京都|Japan|\bJP\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
良心云-英国 = select, 良心云-英国-自动选择
良心云-英国-自动选择 = url-test, include-all=true, filter=(?i)^良心云\s*\|.*(?:🇬🇧|英国|英國|United\s*Kingdom|\bUK\b|\bGB\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50

AshCloud-香港 = select, AshCloud-香港-自动选择
AshCloud-香港-自动选择 = url-test, include-all=true, filter=(?i)^AshCloud\s*\|.*(?:🇭🇰|香港|Hong\s*Kong|\bHK\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
AshCloud-台湾 = select, AshCloud-台湾-自动选择
AshCloud-台湾-自动选择 = url-test, include-all=true, filter=(?i)^AshCloud\s*\|.*(?:🇹🇼|台湾|台灣|台北|高雄|Taiwan|\bTW\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
AshCloud-澳门 = select, AshCloud-澳门-自动选择
AshCloud-澳门-自动选择 = url-test, include-all=true, filter=(?i)^AshCloud\s*\|.*(?:🇲🇴|澳门|澳門|Macau|Macao|\bMO\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
AshCloud-美国 = select, AshCloud-美国-自动选择
AshCloud-美国-自动选择 = url-test, include-all=true, filter=(?i)^AshCloud\s*\|.*(?:🇺🇸|美国|美國|纽约|洛杉矶|旧金山|西雅图|USA|\bUS\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
AshCloud-新加坡 = select, AshCloud-新加坡-自动选择
AshCloud-新加坡-自动选择 = url-test, include-all=true, filter=(?i)^AshCloud\s*\|.*(?:🇸🇬|新加坡|狮城|Singapore|\bSG\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
AshCloud-日本 = select, AshCloud-日本-自动选择
AshCloud-日本-自动选择 = url-test, include-all=true, filter=(?i)^AshCloud\s*\|.*(?:🇯🇵|日本|东京|大阪|京都|Japan|\bJP\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
AshCloud-韩国 = select, AshCloud-韩国-自动选择
AshCloud-韩国-自动选择 = url-test, include-all=true, filter=(?i)^AshCloud\s*\|.*(?:🇰🇷|韩国|韓國|Korea|\bKR\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
AshCloud-德国 = select, AshCloud-德国-自动选择
AshCloud-德国-自动选择 = url-test, include-all=true, filter=(?i)^AshCloud\s*\|.*(?:🇩🇪|德国|德國|Germany|\bDE\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
AshCloud-印度 = select, AshCloud-印度-自动选择
AshCloud-印度-自动选择 = url-test, include-all=true, filter=(?i)^AshCloud\s*\|.*(?:🇮🇳|印度|India|\bIN\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
AshCloud-立陶宛 = select, AshCloud-立陶宛-自动选择
AshCloud-立陶宛-自动选择 = url-test, include-all=true, filter=(?i)^AshCloud\s*\|.*(?:🇱🇹|立陶宛|Lithuania|\bLT\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
AshCloud-荷兰 = select, AshCloud-荷兰-自动选择
AshCloud-荷兰-自动选择 = url-test, include-all=true, filter=(?i)^AshCloud\s*\|.*(?:🇳🇱|荷兰|荷蘭|Netherlands|\bNL\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
AshCloud-英国 = select, AshCloud-英国-自动选择
AshCloud-英国-自动选择 = url-test, include-all=true, filter=(?i)^AshCloud\s*\|.*(?:🇬🇧|英国|英國|United\s*Kingdom|\bUK\b|\bGB\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
AshCloud-法国 = select, AshCloud-法国-自动选择
AshCloud-法国-自动选择 = url-test, include-all=true, filter=(?i)^AshCloud\s*\|.*(?:🇫🇷|法国|法國|France|\bFR\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
AshCloud-马来西亚 = select, AshCloud-马来西亚-自动选择
AshCloud-马来西亚-自动选择 = url-test, include-all=true, filter=(?i)^AshCloud\s*\|.*(?:🇲🇾|马来西亚|Malaysia|\bMY\b), url=http://www.gstatic.com/generate_204, interval=300, tolerance=50

